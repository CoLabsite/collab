<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoLab</title>
    <link rel="stylesheet" href="main.css">
</head>
<body id="appView">
    <header class="appHeader">
        <a href="#" class="brand">
            <img src="logotip.img" class="brandLogo">
            CoLab </a>
        <nav>
            <button class="navButton active" data-page="posts">Задачи</button>
            <button class="navButton" data-page="profile">Профиль</button>
        </nav>
        <div class="headerUser">
            <span id="headerNick">Пользователь</span>
            <button id="logoutButton" class="logoutButton" title="Выйти">↗</button>
        </div>
    </header>
    <main class="appMain">
        <section id="postsPage" class="page">
            <div class="pageHeading">
                <h1>Актуальные<br><em>проблемы</em></h1>
                <button id="newPostButton" class="primaryButton compact">+ Опубликовать задачу</button>
            </div>
            <div class="toolbar">
                <div class="searchBox">
                    <input type="text" id="searchInput" placeholder="Поиск задач...">
                </div>
                <div class="filters">
                    <button class="filter active" data-filter="all">Все</button>
                    <button class="filter" data-filter="student">Ученики</button>
                    <button class="filter" data-filter="scientist">Ученые</button>
                    <button class="filter" data-filter="company">Компании</button>
                    <button class="filter" data-filter="other">Другое</button>
                </div>
            </div>
            <div id="postsList" class="postsList"></div>
        </section>
        <section id="profilePage" class="page hidden">
            <div class="profileHero">
                <div>
                    <h2 id="profileNick">Пользователь</h2>
                    <div id="profileRole" class="profileRole">Участник</div>
                </div>
            </div>
            <div class="profileStats">
                <div>
                    <strong id="profileProblems">0</strong>
                    <span>Опубликовано задач</span>
                </div>
                <div>
                    <strong id="profileSolutions">0</strong>
                    <span>Предложено решений</span>
                </div>
            </div>
            <div class="profileColumns">
                <div>
                    <h3>Мои проблемы</h3>
                    <div id="myPostsList" class="profileItemsList"></div>
                </div>
                <div style="margin-top: 30px;">
                    <h3>Мои решения</h3>
                    <div id="mySolutionsList" class="profileItemsList"></div>
                </div>
            </div>
        </section>
    </main>
    <div id="postModal" class="modal hidden">
        <div class="modalCard">
            <button class="closeButton" data-close="postModal">×</button>
            <h2>Новая задача</h2>
            <label>Заголовок *
                <input type="text" id="postTitle" placeholder="Краткое название (обязательно)">
            </label>
            <label>Описание *
                <textarea id="postDescription" rows="4" maxlength="400" placeholder="Подробное описание проблемы... (обязательно)"></textarea>
                <div class="charCounter"><span id="descCharCount">0</span> / 400 символов</div>
            </label>
            <label>Ссылка на доп. материалы (GitHub, Figma, диск и т.д.)
                <input type="url" id="postLink" placeholder="https://...">
            </label>
            <label>Ваша почта / Телеграм (для связи)
                <input type="email" id="postEmail" placeholder="example@mail.com">
            </label>
            <label>Тег
                <input type="text" id="postTag" placeholder="экология, IT и т.д.">
            </label>
            <div id="postMessage" class="message"></div>
            <button id="savePostButton" class="primaryButton">Опубликовать</button>
        </div>
    </div>
    <div id="solutionModal" class="modal hidden">
        <div class="modalCard">
            <button class="closeButton" data-close="solutionModal">×</button>
            <h2>Предложить решение</h2>
            <input type="hidden" id="targetPostId">
            <label>Ваше решение / Комментарий *
                <textarea id="solutionDescription" rows="4" placeholder="Опишите, как вы предлагаете решить проблему..."></textarea>
            </label>
            <label>Ссылка на решение (GitHub, репозиторий, документ)
                <input type="url" id="solutionLink" placeholder="https://github.com/...">
            </label>
            <label>Контакт для связи (Email / Telegram / Телефон)
                <input type="text" id="solutionContact" placeholder="example@mail.com или @telegram">
            </label>
            <div id="solutionMessage" class="message"></div>
            <button id="saveSolutionButton" class="primaryButton">Отправить решение</button>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="main.js"></script>
</body>
</html>
